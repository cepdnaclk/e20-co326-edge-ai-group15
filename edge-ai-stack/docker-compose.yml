services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-p", "1883", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  python-app:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: vibration-python-app
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - BROKER_HOST=mosquitto
      - BROKER_PORT=1883
      - GROUP_ID=group01
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nodered:
    build:
      context: ./node-red
      dockerfile: Dockerfile
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./node-red:/data
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
